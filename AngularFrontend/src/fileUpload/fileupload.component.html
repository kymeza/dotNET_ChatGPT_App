<!-- File Upload Form -->
<form (ngSubmit)="uploadFile()">
    <div class="form-group">
      <label for="fileInput">Select file to upload:</label>
      <input type="file" class="form-control" id="fileInput" (change)="onFileSelected($event)" required>
    </div>
    <div class="form-group">
      <label for="fileNameInput">File name:</label>
      <input type="text" class="form-control" id="fileNameInput" [(ngModel)]="fileName" name="fileName" placeholder="Enter file name for the upload" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload File</button>
  </form>
  
  <!-- Display Upload Status -->
  <div *ngIf="uploadStatus" class="mt-2">
    {{ uploadStatus }}
</div>/
